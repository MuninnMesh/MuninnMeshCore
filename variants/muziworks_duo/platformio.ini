; ----------------- MuziWorks Base Duo (nRF52840 + LR1121) ---------------------
; Battery percentage uses a generic 1S Li-ion open-circuit-voltage lookup. It is
; best interpreted after load settles; the firmware reports raw millivolts for
; diagnostics so manual testing can catch divider/reference issues.
[muzi_base_duo]
extends = nrf52_base
board = muzi_base_duo
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/muziworks_duo
  -D NRF52_PLATFORM
  -D MUZI_BASE_DUO
  -D MUZIWORKS_DUO
  -D NRF52_POWER_MANAGEMENT
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=20
  -D BATT_USE_OCV_PERCENT=1
  -D BATT_OCV_100_MILLIVOLTS=4200
  -D BATT_OCV_90_MILLIVOLTS=4060
  -D BATT_OCV_80_MILLIVOLTS=3980
  -D BATT_OCV_70_MILLIVOLTS=3920
  -D BATT_OCV_60_MILLIVOLTS=3870
  -D BATT_OCV_50_MILLIVOLTS=3820
  -D BATT_OCV_40_MILLIVOLTS=3790
  -D BATT_OCV_30_MILLIVOLTS=3750
  -D BATT_OCV_20_MILLIVOLTS=3700
  -D BATT_OCV_10_MILLIVOLTS=3600
  -D BATT_OCV_0_MILLIVOLTS=3300
  -D RX_BOOSTED_GAIN=true
  -D RF_SWITCH_TABLE
  -D RADIO_GET_RNG_SEED=radio_get_rng_seed
  -D P_LORA_DIO_1=40
  -D P_LORA_RESET=42
  -D P_LORA_BUSY=43
  -D P_LORA_NSS=44
  -D P_LORA_SCLK=45
  -D P_LORA_MOSI=46
  -D P_LORA_MISO=47
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.0
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/muziworks_duo>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[muziworks_duo]
extends = muzi_base_duo

