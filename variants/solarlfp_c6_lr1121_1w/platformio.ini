; SolarLFP C6 LR1121 1W
; Seeed XIAO ESP32-C6 plus NiceRF LoRa1121F33-2G4 (Semtech LR1121 + 1W sub-GHz
; PA + 2.4G FEM).
;
; Module facts (NiceRF_LR1121_F33.pdf rev 1.2):
;  - 868/915MHz: 1W class, max +31 dBm; 2W rating applies to 433MHz only.
;  - TX power register == SX-style chip dBm (SetTxParams). 915MHz curve:
;    13 -> +22.3dBm/334mA, 16 -> +25.4/426, 19 -> +28.7/580, 22 -> +30.8/730.
;    Linear all the way to 22 at 915MHz — 22 is the characterized max, no
;    over-drive region. RadioLib rejects >22 anyway.
;  - Supply 3.0-5.5V, 5.0V typical. PA power tracks the rail:
;    5.0V -> +30.5dBm/700mA at 915. Run the rail at 5.0V, >=1A capable.
;  - RF switch is INSIDE the module, driven by LR1121 DIO5-DIO8; the switch
;    table lives in target.cpp (sub-GHz TXEN = DIO6). Logic pins are 3.3V.

[SolarLFP_C6_LR1121_1W]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32c6_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/solarlfp_c6_lr1121_1w
  -I variants/xiao_c6
  -D SOLARLFP_C6_LR1121_1W
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_AHTX0
  -UENV_INCLUDE_BME280
  -UENV_INCLUDE_BMP280
  -UENV_INCLUDE_SHTC3
  -UENV_INCLUDE_SHT4X
  -UENV_INCLUDE_LPS22HB
  -UENV_INCLUDE_INA219
  -UENV_INCLUDE_INA226
  -UENV_INCLUDE_INA260
  -UENV_INCLUDE_MLX90614
  -UENV_INCLUDE_VL53L0X
  -UENV_INCLUDE_BME680
  -UENV_INCLUDE_BMP085
  ; XIAO ESP32-C6 to LoRa1121F33-2G4 pin map.
  ; Module pins: 12=SCK 13=NSS 14=BUSY 15=MOSI 16=MISO 17=RESET 18=IRQ(DIO9) 5=CE.
  -D P_LORA_SCLK=19
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=18
  -D P_LORA_NSS=22
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=21
  -D P_LORA_DIO_1=1
  ; CE = module LDO enable (internally pulled up; low = module sleep).
  -D P_LORA_EN=23
  ; NiceRF F33 runs its 32MHz 0.5ppm TCXO from VTCXO(DIO3) at 3.3V — same as
  ; our battle-tested LR2021F33 profile in munnin-lr2021-rs.
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.3
  ; Also seeds the rx_boosted_gain pref default in MyMesh (the SX126x-only
  ; ctor default left it 0 on LR1121 builds, silently un-boosting the LNA).
  -D RX_BOOSTED_GAIN=true
  ; Route WiFi/BLE through the external U.FL antenna (GPIO3 low = RF switch
  ; powered, GPIO14 high = external port). The external antenna IS fitted.
  -D USE_XIAO_ESP32C6_EXTERNAL_ANTENNA=1
  ; A LoRa repeater is not CPU-bound; 80MHz saves ~10mA and still meets
  ; WiFi's minimum clock for OTA mode.
  -D ESP32_CPU_FREQ=80
  -D USE_LR1121
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  ; LR1121 *chip* drive in dBm (SetTxParams), not antenna power. 22 = HP PA max
  ; -> ~+30.8dBm (~1.2W) module output at 915MHz, inside NiceRF's characterized
  ; table (linear region — no over-drive concern on this module). RadioLib
  ; auto-selects the HP PA (VBAT-supplied) for values >14 and errors above 22;
  ; radio_set_tx_power() additionally clamps to MAX_LORA_TX_POWER.
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  ; Muninn US915 channel used by the gate and Valhalla.
  -D LORA_FREQ=910.525
  -D LORA_SF=7
  -D LORA_BW=62.5
  -D LORA_CR=5
  ; Board I/O.
  -D PIN_USER_BTN=9
  -D PIN_STATUS_LED=15
  -D PIN_STATUS_LED_ON=LOW
  -D PIN_BOARD_SDA=16
  -D PIN_BOARD_SCL=17
  ; Telemetry sensors for this board.
  -D TELEM_INA3221_ADDRESS=0x41
  -D TELEM_INA3221_SHUNT_VALUE=0.1
  -D ENV_INCLUDE_BME690=1
  -D TELEM_BME690_ADDRESS=0x76
  -D TELEM_BME690_ADDRESS_ALT=0x77
  -D DISABLE_DS3231_PROBE=1
  -D DISABLE_PCF8563_PROBE=1
  -D DISABLE_RX8130CE_PROBE=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/solarlfp_c6_lr1121_1w>
  +<helpers/sensors>
lib_deps =
  ${esp32c6_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:SolarLFP_C6_LR1121_1W_repeater]
extends = SolarLFP_C6_LR1121_1W
build_flags =
  ${SolarLFP_C6_LR1121_1W.build_flags}
  ; Suffix the stock version (MyMesh.h default) so the Admin UI shows which
  ; hardware build this node runs.
  -D FIRMWARE_VERSION='"v1.16.0-C6_LR1121.rc10"'
  ; WiFi-client OTA over mesh CLI: wifi scan / start wifi-ota / ota status|abort
  -D ENABLE_WIFI_OTA=1
  -D ADVERT_NAME='"SolarLFP C6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"39572685"'
  -D MAX_NEIGHBOURS=50
  -D TELEM_REPLY_PER_PACKET_POWER
  -D TELEM_REPLY_ZEROHOP_DEFAULT=1
  ; 150ms is Bosch's nominal heater time — 20ms never reached heat-stable, so
  ; gas read as a constant junk value. 30s sampling keeps the average heater
  ; power at the old 20ms/5s level (telemetry is only polled every 60s anyway).
  -D BME690_HEATER_DURATION_MS=150
  -D BME690_SAMPLE_INTERVAL_MS=30000
  ; Auto-stop the MeshCore-OTA AP after 15min with no connected client.
  -D WIFI_OTA_IDLE_TIMEOUT_MINS=15
  ; Reset-on-hang for unattended deployment; fed from loop(). Events show up
  ; in the 'resets' CLI tally.
  -D TASK_WDT_TIMEOUT_SECS=60
  -UENABLE_ADVERT_ON_BOOT
  -D ENABLE_ADVERT_ON_BOOT=0
  ; Radio params (freq/bw/sf/cr) come from SAVED PREFS set via the configurator
  ; app / CLI and persist across reboot. The build-time LORA_* values are only the
  ; first-boot default for a never-configured node. (Do NOT re-add
  ; LOCK_RADIO_PARAMS_TO_BUILD — it overwrites user config on every boot.)
build_src_filter = ${SolarLFP_C6_LR1121_1W.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${SolarLFP_C6_LR1121_1W.lib_deps}
  ${esp32_ota.lib_deps}

[env:SolarLFP_C6_LR1121_1W_companion_radio_ble]
extends = SolarLFP_C6_LR1121_1W
build_flags =
  ${SolarLFP_C6_LR1121_1W.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter = ${SolarLFP_C6_LR1121_1W.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SolarLFP_C6_LR1121_1W.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:SolarLFP_C6_LR1121_1W_companion_radio_usb]
extends = SolarLFP_C6_LR1121_1W
build_flags =
  ${SolarLFP_C6_LR1121_1W.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter = ${SolarLFP_C6_LR1121_1W.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SolarLFP_C6_LR1121_1W.lib_deps}
  densaugeo/base64 @ ~1.4.0
